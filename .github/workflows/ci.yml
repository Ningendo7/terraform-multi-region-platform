name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  platformctl:
    name: platformctl (fmt, vet, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/platformctl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/platformctl/go.mod

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  terraform:
    name: terraform (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.8"

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform

      - name: terraform validate
        run: |
          set -e
          for dir in $(find terraform -name '*.tf' -exec dirname {} \; | sort -u); do
            echo "== validating $dir =="
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null
            terraform -chdir="$dir" validate
          done
