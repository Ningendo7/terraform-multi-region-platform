apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        # Pinned to a single small instance type deliberately — this
        # first pass is about proving the NodePool mechanism actually
        # provisions and joins a real EC2 node end-to-end, not about
        # real workload capacity. Broaden this once something needs to
        # actually schedule here.
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t2.nano"]

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

  limits:
    cpu: "1"

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
