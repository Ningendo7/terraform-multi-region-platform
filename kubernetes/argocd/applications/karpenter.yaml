apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default

  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: "1.0.6"
    helm:
      values: |
        settings:
          clusterName: terraform-multi-region-platform-prod

        serviceAccount:
          name: karpenter
          # No role-arn annotation — this service account's IAM role is
          # granted via an aws_eks_pod_identity_association in Terraform
          # (modules/eks), not an IRSA annotation. Keeps this file free
          # of any account-specific information.

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
