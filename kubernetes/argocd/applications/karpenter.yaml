apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default

  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: "1.0.6"
    helm:
      values: |
        settings:
          clusterName: terraform-multi-region-platform-prod

        serviceAccount:
          create: true
          name: karpenter
          # Back to IRSA — EKS Pod Identity does not support Fargate,
          # and this controller has to run on Fargate (that's the whole
          # reason the kube-system Fargate profile exists: to bootstrap
          # it before any EC2 node exists). The account ID below is a
          # real, necessary tradeoff of that constraint, not an
          # oversight — see modules/eks for the corresponding OIDC
          # trust policy.
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::807906459006:role/terraform-multi-region-platform-prod-karpenter-controller

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
