apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: "3.5.0"
    helm:
      values: |
        clusterName: terraform-multi-region-platform-prod

        # Explicit, not auto-detected — this runs on Fargate, which
        # doesn't expose EC2 instance metadata the way real nodes do,
        # so the chart's default IMDS-based auto-detection for these
        # two values can't be relied on here.
        #
        # NOTE: vpcId is AWS-assigned, not something we control the
        # naming of (unlike region/environment) — it changes every time
        # the vpc stack is destroyed and recreated. Update this value
        # after any fresh `vpc` apply, same as re-running
        # `aws eks update-kubeconfig` after a fresh `eks` apply.
        region: us-east-1
        vpcId: vpc-04bcd7384c821cea3

        serviceAccount:
          create: true
          name: aws-load-balancer-controller
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::807906459006:role/terraform-multi-region-platform-prod-lb-controller

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false