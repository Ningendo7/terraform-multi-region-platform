apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "88.6.1"
    helm:
      values: |
        # Fargate doesn't support DaemonSets — node-exporter would sit
        # permanently Pending, same as every other DaemonSet-on-Fargate
        # gotcha this cluster has hit. Pod/container-level metrics still
        # work fine via kube-state-metrics and the kubelet's own metrics
        # endpoint; only host-level stats (disk/network at the node
        # level) are unavailable, which don't really apply to Fargate's
        # compute model anyway.
        nodeExporter:
          enabled: false

        # Ephemeral storage on purpose for this pass — Fargate only
        # supports EFS for persistent volumes (not EBS, since there's
        # no real instance to attach a volume to), and that's real
        # additional infrastructure not built yet. Short retention
        # keeps it from filling Fargate's default ephemeral storage;
        # metric data loss on pod restart is an accepted tradeoff here,
        # not an oversight.
        prometheus:
          prometheusSpec:
            retention: 24h
            # No resources set by default → Fargate sizes the pod small,
            # and evaluating this chart's ~35 default PrometheusRule
            # groups under that CPU ceiling makes the -/healthy and
            # -/ready endpoints slow enough to blow the liveness probe's
            # timeout — observed as repeated restarts, not a real crash.
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: "1"
                memory: 2Gi

        # EKS manages the control plane — these components' metrics
        # endpoints were never reachable on this cluster to begin with.
        # Monitoring them isn't just dead weight, it's actively part of
        # what pushed Prometheus's rule-evaluation load (and this
        # account's tight Fargate vCPU quota) past what it could handle.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        # Fargate doesn't run kube-proxy — no node-level networking
        # layer to monitor here either (see modules/eks ALB target-type
        # notes for the same reason).
        kubeProxy:
          enabled: false

        # Disabled — the admission webhook's cert-generation PreSync
        # hook Job got ArgoCD's operation tracking stuck twice in a row
        # (an ArgoCD-side caching issue, not a real failure: the Job
        # itself completed fine both times, ArgoCD just never noticed).
        # Not required for the stack to function — it only pre-validates
        # Prometheus/Alertmanager CRs before they're accepted, which is
        # a nice-to-have, not load-bearing.
        prometheusOperator:
          admissionWebhooks:
            enabled: false
          # Separate from admissionWebhooks.enabled — this is the
          # operator's own --web.enable-tls flag, which (independently)
          # expects a cert from the same disabled admission-webhook Job.
          # Without turning this off too, the operator pod stays stuck
          # on a FailedMount for a secret that's never going to exist.
          tls:
            enabled: false

        # Grafana's own liveness probe (60s initial delay, 10 failures *
        # 10s period ≈ 160s total grace) is tuned for the old, faster
        # startup. Its current grafana-apiserver init sequence has been
        # observed taking 2-3+ minutes on Fargate, so the default grace
        # period kills it mid-startup — an infinite restart loop, not a
        # real crash. Widening the grace period fixes it at the cause
        # instead of just tolerating the restarts.
        grafana:
          livenessProbe:
            initialDelaySeconds: 120
            failureThreshold: 15
            periodSeconds: 10
            timeoutSeconds: 30
          readinessProbe:
            initialDelaySeconds: 60
          # Same story as the operator and Prometheus: no resources set
          # meant Fargate's default was too small, and this version's
          # apiserver-based startup genuinely needs more than that —
          # observed as OOMKilled, not a probe-timing issue.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # kube-prometheus-stack's CRDs are large enough to exceed the
      # 256KiB annotation limit kubectl's client-side apply relies on —
      # a well-documented, common failure with this exact chart.
      # Server-side apply avoids it entirely.
      - ServerSideApply=true
