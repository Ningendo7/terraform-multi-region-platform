apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default

  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: "1.0.6"
    helm:
      values: |
        settings:
          clusterName: terraform-multi-region-platform-prod

        serviceAccount:
          create: true
          name: karpenter
          # IRSA, same reasoning as us-east-1's — Fargate doesn't
          # support Pod Identity, and this controller has to run on
          # Fargate to bootstrap before any EC2 node exists.
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::807906459006:role/terraform-multi-region-platform-prod-use2-karpenter-controller

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
